<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>student registration form</title>
</head>
<body>
    <section>
        <div>
            <div>
                <form >
                    <label for="name">NAME:</label>
                    <input type="text" id="name" name="name"><br>
                    <label for="email">EMAIL:</label>
                    <input type="email" id="email" name="email"><br>
                    <label for="age">AGE:</label>
                    <input type="number" id="age" name="age"><br>
                    <label for="date of birth"> DATE OF BIRTH :</label>
                    <input type="date" id="date of birth" name="date of birth"><br>
                    <label for="male">male</label>
                    <input type="radio" name="gender" id="male"><br>
                    <label for="female">female</label>
                    <input type="radio" name="gender" id="gender"><br>
                    <label for="cource">cource</label>
                    <select name="cource" id="cource">
                        <option value="html">HTML </option>
                        <option value="java">java</option><br>
                    </select>
                    <label for="address">address</label><br>
                    <textarea name="address" id="address" placeholder="enter ur"></textarea>
                </form>
            </div>
        </div>
    </section>
    
</body>
</html>
